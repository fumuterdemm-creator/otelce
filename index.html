<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezifix.tr — Seyahat & Otel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

        /* Header */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-main { font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; }
        .logo-main span { color: var(--accent); }
        .logo-tr-badge { background: #e11d48; color: #fff; font-family: 'Permanent Marker', cursive, sans-serif; font-size: 13px; padding: 2px 8px; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 2px 8px rgba(225, 29, 72, 0.4); }

        .auth-btns { display: flex; gap: 10px; align-items: center; }
        .btn-ghost { background: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-solid { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-solid:hover { background: var(--primary-hover); }

        /* Main Container */
        main { max-width: 1100px; margin: 0 auto; width: 100%; padding: 36px 16px; flex-grow: 1; }

        /* Sekmeler */
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-item { background: #1e293b; border: 1px solid var(--border); color: var(--text-sub); padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .tab-item.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Hero Section & Form */
        .hero-section { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 24px; padding: 32px; box-shadow: 0 15px 30px rgba(0,0,0,0.3); margin-bottom: 32px; }
        .hero-title { font-size: 30px; font-weight: 900; margin-bottom: 6px; color: #fff; }
        .hero-title span { color: var(--accent); }
        .hero-subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; }

        .search-grid { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1fr 1fr; gap: 10px; background: #0f172a; padding: 12px; border-radius: 16px; border: 1px solid var(--border); }
        @media (max-width: 900px) { .search-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 600px) { .search-grid { grid-template-columns: 1fr; } }

        .field-box { display: flex; flex-direction: column; padding: 8px 12px; background: #1e293b; border-radius: 10px; border: 1px solid transparent; }
        .field-box:focus-within { border-color: var(--accent); }
        .field-box label { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        .field-box input, .field-box select { background: transparent; border: none; color: #fff; font-size: 13px; font-weight: 700; outline: none; width: 100%; }

        .btn-search-main { background: var(--primary); color: #fff; font-size: 15px; font-weight: 800; padding: 16px; border-radius: 12px; border: none; cursor: pointer; width: 100%; margin-top: 12px; transition: 0.2s; }
        .btn-search-main:hover { background: var(--primary-hover); }

        /* Otel Kartları */
        .hotel-card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; display: grid; grid-template-columns: 300px 1fr; margin-bottom: 20px; transition: 0.2s; }
        .hotel-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        @media (max-width: 768px) { .hotel-card { grid-template-columns: 1fr; } }

        .hotel-media { position: relative; height: 100%; min-height: 200px; }
        .hotel-media img { width: 100%; height: 100%; object-fit: cover; }
        .badge-tag { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.9); color: var(--accent); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }
        .badge-live { position: absolute; bottom: 12px; left: 12px; background: #e11d48; color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; }

        .hotel-details { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .hotel-name { font-size: 19px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .hotel-loc { font-size: 13px; color: var(--text-sub); }
        .hotel-chips { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
        .chip { background: #0f172a; color: var(--text-sub); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }

        .hotel-price-row { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 12px; }
        .price-val { font-size: 24px; font-weight: 900; color: var(--accent); }

        /* Modal Overlay */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: flex !important; }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 460px; border-radius: 20px; border: 1px solid var(--border); padding: 28px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 18px; color: var(--text-sub); cursor: pointer; }

        footer { background: #0f172a; border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 13px; color: var(--text-sub); margin-top: 40px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="/" class="logo">
            <span class="logo-main">Gezi<span>Fix</span></span>
            <div class="logo-tr-badge">TR</div>
        </a>

        <div class="auth-btns">
            <button onclick="openModal('authModal')" class="btn-ghost">Giriş Yap</button>
            <button onclick="openModal('authModal')" class="btn-solid">Üye Ol</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Sekmeler -->
        <div class="tab-bar">
            <button class="tab-item active" onclick="switchTab('domestic', this)">🇹🇷 Yurt İçi Oteller</button>
            <button class="tab-item" onclick="switchTab('international', this)">🌍 Yurt Dışı Oteller</button>
        </div>

        <!-- Hero Section & Arama Formu -->
        <div class="hero-section">
            <h1 class="hero-title">En Uygun Oteli <span>Keşfet</span></h1>
            <p class="hero-subtitle">Canlı doluluk oranları, anlık fiyat hesaplama ve komisyonsuz rezervasyon altyapısı.</p>

            <form onsubmit="handleSearch(event)">
                <div class="search-grid">
                    <div class="field-box">
                        <label>Destinasyon</label>
                        <input type="text" id="destination" placeholder="Otel adı veya şehir yazın...">
                    </div>
                    <div class="field-box">
                        <label>Giriş Tarihi</label>
                        <input type="date" id="checkin">
                    </div>
                    <div class="field-box">
                        <label>Çıkış Tarihi</label>
                        <input type="date" id="checkout">
                    </div>
                    <div class="field-box">
                        <label>Oda Sayısı</label>
                        <select id="rooms" onchange="renderHotels()">
                            <option value="1">1 Oda</option>
                            <option value="2">2 Oda</option>
                            <option value="3">3 Oda</option>
                        </select>
                    </div>
                    <div class="field-box">
                        <label>Kişi Sayısı</label>
                        <select id="guests">
                            <option value="1">1 Yetişkin</option>
                            <option value="2" selected>2 Yetişkin</option>
                            <option value="3">3 Kişi</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-search-main">Otelleri Listele & Fiyatları Gör 🔍</button>
            </form>
        </div>

        <!-- Otellerin Listeleneceği Alan -->
        <div id="hotelsContainer"></div>
    </main>

    <footer>
        &copy; 2026 Gezifix.tr — Tüm hakları saklıdır.
    </footer>

    <!-- Booking / Entegrasyon Modalı -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal-box">
            <button onclick="closeModal('bookingModal')" class="modal-close-btn">✕</button>
            <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;" id="modalHotelTitle">Otel Adı</h3>
            <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 16px;" id="modalHotelSub">Rezervasyon yönlendirmesi hazırlanıyor.</p>
            <div style="background:#0f172a; padding:16px; border-radius:12px; border:1px solid var(--border); margin-bottom:16px; font-size:13px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Giriş/Çıkış:</span><strong id="modalDates">-</strong></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Oda Sayısı:</span><strong id="modalRooms">-</strong></div>
                <div style="display:flex; justify-content:space-between; border-top:1px dashed var(--border); padding-top:6px; color:var(--accent);"><span>Hesaplanan Tutar:</span><strong id="modalPrice">-</strong></div>
            </div>
            <button onclick="redirectToPartner()" class="btn-solid" style="width:100%; padding:14px;">Ortaklık Kanalına Bağlan & Tamamla 🚀</button>
        </div>
    </div>

    <!-- Auth Modalı -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-box">
            <button onclick="closeModal('authModal')" class="modal-close-btn">✕</button>
            <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 16px;">Gezifix'e Giriş Yap</h3>
            <form onsubmit="event.preventDefault(); alert('Giriş Başarılı!'); closeModal('authModal');">
                <input type="email" required placeholder="E-Posta Adresi" style="width:100%; padding:12px; background:#0f172a; border:1px solid var(--border); border-radius:10px; color:#fff; margin-bottom:12px; outline:none;">
                <input type="password" required placeholder="Şifre" style="width:100%; padding:12px; background:#0f172a; border:1px solid var(--border); border-radius:10px; color:#fff; margin-bottom:16px; outline:none;">
                <button type="submit" class="btn-solid" style="width:100%; padding:12px;">Devam Et</button>
            </form>
        </div>
    </div>

    <script>
        const hotelsDatabase = [
            { id: 1, type: "domestic", name: "Ardos Park Hotel", city: "Ankara", location: "Çankaya, Ankara", price: 2400, rating: 9.4, tag: "İş & Şehir", badge: "🔥 Son 2 Oda!", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" },
            { id: 2, type: "domestic", name: "Bodrum Resort & Spa", city: "Bodrum", location: "Yalıkavak, Bodrum", price: 4800, rating: 9.6, tag: "Lüks Tatil", badge: "⚡ Yoğun Talep", img: "https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80" },
            { id: 3, type: "domestic", name: "Antalya Akdeniz Resort", city: "Antalya", location: "Lara, Antalya", price: 3500, rating: 9.1, tag: "Popüler Resort", badge: "🔥 %85 Dolu", img: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=80" },
            { id: 4, type: "domestic", name: "Kapadokya Cave Suites", city: "Kapadokya", location: "Göreme, Nevşehir", price: 4200, rating: 9.8, tag: "Mağara Otel", badge: "⚡ Son 1 Oda!", img: "https://images.unsplash.com/photo-1641128324972-af3212f0f6bd?auto=format&fit=crop&w=800&q=80" },
            { id: 5, type: "international", name: "Paris Grand Hotel", city: "Paris", location: "Merkez, Paris", price: 6500, rating: 9.5, tag: "Eyfel Manzaralı", badge: "🔥 Popüler", img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80" },
            { id: 6, type: "international", name: "Rome Colosseum Resort", city: "Roma", location: "Tarihi Merkez, Roma", price: 5400, rating: 9.2, tag: "Kültür Turu", badge: "⚡ Son 2 Oda!", img: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=80" }
        ];

        let activeTab = 'domestic';
        let selectedHotel = null;

        window.onload = () => {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            document.getElementById('checkin').value = today.toISOString().split('T')[0];
            document.getElementById('checkout').value = tomorrow.toISOString().split('T')[0];
            
            renderHotels();
        };

        function switchTab(type, btn) {
            activeTab = type;
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderHotels();
        }

        function calculateNights() {
            const inDate = new Date(document.getElementById('checkin').value);
            const outDate = new Date(document.getElementById('checkout').value);
            const diff = Math.ceil((outDate - inDate) / (1000 * 60 * 60 * 24));
            return diff > 0 ? diff : 1;
        }

        function renderHotels(filteredList) {
            const container = document.getElementById('hotelsContainer');
            container.innerHTML = '';
            
            const list = filteredList || hotelsDatabase.filter(h => h.type === activeTab);
            const nights = calculateNights();
            const rooms = parseInt(document.getElementById('rooms').value) || 1;

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; background:#1e293b; border-radius:16px; border:1px solid var(--border); color:var(--text-sub);">Aramanıza uygun otel bulunamadı. Lütfen arama terimini değiştirin.</div>`;
                return;
            }

            list.forEach(h => {
                const totalPrice = h.price * nights * rooms;
                container.innerHTML += `
                    <div class="hotel-card">
                        <div class="hotel-media">
                            <img src="${h.img}" alt="${h.name}">
                            <span class="badge-tag">${h.tag}</span>
                            <span class="badge-live">${h.badge}</span>
                        </div>
                        <div class="hotel-details">
                            <div>
                                <h3 class="hotel-name">${h.name}</h3>
                                <div class="hotel-loc">📍 ${h.location}</div>
                                <div class="hotel-chips">
                                    <span class="chip">Ücretsiz Wi-Fi</span>
                                    <span class="chip">Kahvaltı Dahil</span>
                                    <span class="chip">★ ${h.rating}</span>
                                </div>
                            </div>
                            <div class="hotel-price-row">
                                <div>
                                    <span style="font-size:11px; color:var(--text-sub);">Gecelik Fiyat</span>
                                    <div class="price-val">₺${h.price.toLocaleString('tr-TR')}</div>
                                    <div style="font-size:11px; color:var(--text-sub);">Toplam (${nights} Gece): ₺${totalPrice.toLocaleString('tr-TR')}</div>
                                </div>
                                <button onclick="startBooking(${h.id})" class="btn-solid">Rezervasyon Yap 🚀</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('destination').value.trim().toLowerCase();
            
            const filtered = hotelsDatabase.filter(h => {
                const matchType = h.type === activeTab;
                const matchQuery = !query || h.name.toLowerCase().includes(query) || h.city.toLowerCase().includes(query) || h.location.toLowerCase().includes(query);
                return matchType && matchQuery;
            });

            renderHotels(filtered);
        }

        function startBooking(id) {
            selectedHotel = hotelsDatabase.find(h => h.id === id);
            if (!selectedHotel) return;

            const nights = calculateNights();
            const rooms = document.getElementById('rooms').value;
            const totalPrice = selectedHotel.price * nights * parseInt(rooms);

            document.getElementById('modalHotelTitle').textContent = selectedHotel.name;
            document.getElementById('modalHotelSub').textContent = `${selectedHotel.location} tesisinde konaklama`;
            document.getElementById('modalDates').textContent = `${document.getElementById('checkin').value} / ${document.getElementById('checkout').value} (${nights} Gece)`;
            document.getElementById('modalRooms').textContent = `${rooms} Oda`;
            document.getElementById('modalPrice').textContent = `₺${totalPrice.toLocaleString('tr-TR')}`;

            openModal('bookingModal');
        }

        function redirectToPartner() {
            closeModal('bookingModal');
            alert(`${selectedHotel.name} için anlaşmalı ortaklık rezervasyon kanalına yönlendiriliyorsunuz!`);
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
