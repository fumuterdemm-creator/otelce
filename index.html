<html lang="tr">

    <style>

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Header */
        header { background: #ffffff; border-bottom: 1px solid #f1f5f9; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }

        .logo-text { font-size: 24px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px; }

        .auth-buttons { display: flex; align-items: center; gap: 12px; }

        .btn-register { background: #2563eb; color: #ffffff; border: none; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .btn-register:hover { background: #1d4ed8; }

        /* Gelişmiş ETS/Hotels Tarzı Kullanıcı Paneli */
        .user-menu-container { position: relative; display: none; }
        .user-menu-btn { display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .user-menu-btn:hover { border-color: #2563eb; background: #f8fafc; }
        .user-avatar { width: 32px; height: 32px; background: #2563eb; color: #ffffff; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .user-name { font-size: 14px; font-weight: 700; color: #0f172a; }

        /* Dropdown Menü */
        .user-dropdown { position: absolute; right: 0; top: 48px; width: 220px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); padding: 8px; display: none; z-index: 50; }
        .user-dropdown.active { display: block; }
        .dropdown-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: #334155; text-align: left; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .dropdown-item:hover { background: #f1f5f9; color: #2563eb; }
        .dropdown-divider { height: 1px; background: #f1f5f9; margin: 6px 0; }
        .dropdown-item.logout { color: #ef4444; }
        .dropdown-item.logout:hover { background: #fee2e2; }

        /* Main Container */
        main { max-width: 1000px; margin: 0 auto; width: 100%; padding: 40px 16px; flex-grow: 1; }
        
        /* Hero Section & Search Box */
        .hero-card { background: #ffffff; border-radius: 24px; padding: 32px; border: 1px solid #e2e8f0; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); margin-bottom: 40px; }
        .hero-title { font-size: 28px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
        .hero-desc { font-size: 14px; color: #64748b; margin-bottom: 24px; }
        
        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .input-group { position: relative; width: 100%; }
        .input-group input { width: 100%; padding: 14px 14px 14px 42px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; background: #ffffff; color: #0f172a; font-family: inherit; }
        .input-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .input-icon { position: absolute; left: 14px; top: 15px; color: #94a3b8; width: 18px; height: 18px; pointer-events: none; }

        .btn-search { width: 100%; background: #2563eb; color: #ffffff; font-size: 15px; font-weight: 700; padding: 16px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); transition: 0.2s; }
        .btn-search:hover { background: #1d4ed8; }

        /* Popular Cards */
        .section-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }

        .card { background: #ffffff; border-radius: 16px; padding: 12px; border: 1px solid #e2e8f0; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.08); }
        .card-img { height: 120px; border-radius: 12px; overflow: hidden; margin-bottom: 10px; background: #e2e8f0; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 14px; font-weight: 700; color: #1e293b; }
        .card-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        /* Footer */
        footer { background: #ffffff; border-top: 1px solid #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: flex !important; }
        .modal-box { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; padding: 28px; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
