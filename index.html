<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezifix.tr - En Uygun Otel Fiyatlarını Karşılaştır</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Stil yüklenmeme riskine karşı form kutusunu garantiye alıyoruz */
        .fallback-box { background: #ffffff; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center border-b border-slate-100 sticky top-0 z-40 backdrop-blur-md bg-white/90">
        
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5 group transition">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-700 via-blue-600 to-indigo-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20 group-hover:scale-105 transition duration-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <div class="flex items-center">
                <span class="text-2xl font-extrabold text-slate-900 tracking-tight group-hover:text-blue-600 transition">gezi<span class="text-blue-600">fix</span></span>
                <span class="ml-1 px-1.5 py-0.5 bg-amber-400 text-slate-900 text-[10px] font-black rounded-md uppercase tracking-wider shadow-sm">tr</span>
            </div>
        </a>
        
        <!-- Üye Girişi ve Kayıt Butonları -->
        <div class="flex items-center space-x-3">
            <button onclick="toggleModal('loginModal')" class="text-sm font-semibold text-slate-600 hover:text-blue-600 px-3 py-2 rounded-lg transition duration-200">
                Giriş Yap
            </button>
            <button onclick="toggleModal('registerModal')" class="text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl shadow-md shadow-blue-600/20 transition duration-200">
                Üye Ol
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-10 space-y-12">
        
        <!-- Hero & Form Section -->
        <div class="fallback-box bg-white rounded-3xl shadow-xl p-6 sm:p-10 border border-slate-100 text-center relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-60 h-60 bg-blue-50 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-60 h-60 bg-indigo-50 rounded-full blur-3xl pointer-events-none"></div>

            <h1 class="text-3xl sm:text-4xl font-black mb-3 text-slate-900 tracking-tight relative z-10">Hayalindeki Tatili En Uygun Fiyata Bul</h1>
            <p class="text-slate-500 mb-8 text-sm sm:text-base relative z-10">Yüzlerce oteli tek tıkla karşılaştır, bütçene en uygun seçeneği yakala.</p>
            
            <!-- Arama Formu -->
            <form id="searchForm" onsubmit="redirectToBooking(event)" class="space-y-4 relative z-10">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    
                    <!-- Destinasyon / Otel -->
                    <div class="relative md:col-span-1">
                        <input type="text" id="destination" required placeholder="Nereye gitmek istersin?" 
                            class="w-full px-4 py-3.5 pl-11 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm bg-white">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>

                    <!-- Giriş Tarihi -->
                    <div class="relative">
                        <input type="date" id="checkin" required class="w-full px-4 py-3.5 pl-11 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm text-slate-600 bg-white">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>

                    <!-- Çıkış Tarihi -->
                    <div class="relative">
                        <input type="date" id="checkout" required class="w-full px-4 py-3.5 pl-11 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm text-slate-600 bg-white">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24
