<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezifix.tr - En Uygun Otel Fiyatlarını Karşılaştır</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="text-2xl font-black text-blue-600 tracking-tight">gezifix<span class="text-yellow-500">.tr</span></div>
        <div class="text-sm font-medium text-slate-500">Güvenilir Otel Karşılaştırma</div>
    </header>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
            <h1 class="text-3xl font-bold mb-3 text-slate-900">Hayalindeki Tatili En Uygun Fiyata Bul</h1>
            <p class="text-slate-500 mb-8 text-sm">Yüzlerce oteli tek tıkla karşılaştır, bütçene en uygun seçeneği yakala.</p>
            
            <!-- Arama Formu -->
            <form id="searchForm" onsubmit="redirectToBooking(event)" class="space-y-4">
                <div class="relative">
                    <input type="text" id="destination" required placeholder="Gitmek istediğin şehir veya otel (örn: Bodrum, Antalya)" 
                        class="w-full px-4 py-3.5 pl-11 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
                    <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-blue-600/20 text-sm">
                    Otel Ara & Fiyatları Karşılaştır 🚀
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
        &copy; 2026 Gezifix.tr - Tüm hakları saklıdır.
    </footer>

    <!-- Yönlendirme Scripti -->
    <script>
        function redirectToBooking(event) {
            event.preventDefault();
            const query = document.getElementById('destination').value.trim();
            if(!query) return;
            
            const encodedQuery = encodeURIComponent(query);
            // Doğrudan Booking.com arama sayfasına yönlendirme (Marker ID ile)
            const targetUrl = `https://www.booking.com/searchresults.tr.html?ss=${encodedQuery}&aid=593176`;
            
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
